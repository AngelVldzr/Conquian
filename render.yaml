# Configuración para publicar en Render (https://render.com) con HTTPS automático.
services:
  - type: web
    name: conquian
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /salud
    envVars:
      - key: NODE_ENV
        value: production
      # Métricas con PostHog (opcional). El valor se pone en Render → Environment, no aquí.
      - key: POSTHOG_KEY
        sync: false
      - key: POSTHOG_HOST
        value: https://us.i.posthog.com
